<script>
(function () {
  if (window.top === window.self) {
    const path = location.pathname.split('/');
    const rootIndex = path.indexOf('web-only') >= 0 ? path.indexOf('web-only') : path.indexOf('admin-only');
    if (rootIndex < 0) return;
    const root = path[rootIndex];
    const fragmentPath = path.slice(rootIndex + 1).join('/');
    const previewPage = '/' + root + '/preview.html?fragment=' + encodeURIComponent(fragmentPath);
    if (!location.pathname.endsWith('/preview.html')) {
      location.replace(previewPage);
    }
  }
})();
</script>
